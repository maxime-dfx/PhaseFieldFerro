# ==============================================================================
# Fichier de Configuration TOML - VALIDATION (Niveau 0 + Niveau 1)
# Utilisé uniquement par Validation.exe : seule la section [material] compte
# réellement pour les tests, le reste est présent pour satisfaire le parseur.
# ==============================================================================
[output]
OutputDir = "../output"
MeshCreateFile = "../input/rectangle.msh"

[debug]
enabled = false

[chrono]
chrono_mesh = false
chrono_Mechanics = false
chrono_Fracture = false
chrono_Polarization = false
chrono_Electrostatics = false
chrono_run = false

[physics]
enable_polarization = true
enable_mecanics = true
enable_electrostatics = false
enable_fracture = true

[simulation]
total_time = 1.0
dt = 0.001
save_frequency = 1
tolerance_ferro = 1e-5
tolerance_vfield = 1e-5

[mesh]
calcul_mesh = true
L_x = 100.0
L_y = 100.0
n_x = 100
n_y = 100
element_type = "QUAD"

[mechanics]
initial_mechanics = "UNIFORM"
ux_0 = 0.0
uy_0 = 0.0

[fracture]
mode = "PERMEABLE"
enable_precrack = false

[polarization]
initial_polarization = "UNIFORM"
Px_0 = 1.0
Py_0 = 0.0

# ==============================================================================
# PARAMÈTRES MATÉRIAU (les seuls réellement utilisés par Validation.exe)
# Valeurs identiques à Niveau0.toml pour rester cohérent avec les tests validés
# ==============================================================================
[material]
c1 = 185.0
c2 = 111.0
c3 = 74.0

Gc    = 4.0
kappa = 2.0
mu_v  = 15.0
eta_k = 1e-6

alpha_1    = -0.0023
alpha_11   = -0.0029
alpha_12   = -0.0011
alpha_111  = 0.003
alpha_112  = -0.00068
alpha_1111 = 0.001
alpha_1112 = 0.0093
alpha_1122 = 1.24

b1 = 1.4282
b2 = -0.185
b3 = 0.8066

eps0 = 0.131
t    = 300.0
P0   = 1.0
c0   = 1.0
xi   = 1.0

a0   = 0.1
mu_p = 1.0

# =======================================================
# CONDITIONS DE VALIDATION POUR LA POLARISATION (Paroi 180°)
# =======================================================
# --- MECANIQUE (Pour éviter que le maillage ne vole en éclats) ---
[[boundary_rule]]
field     = "ux"
shape     = "edge"
edge_name = "left"
bc_type   = "DIRICHLET"
profile   = "constant"
val       = 0.0

[[boundary_rule]]
field     = "uy"
shape     = "edge"
edge_name = "bottom"
bc_type   = "DIRICHLET"
profile   = "constant"
val       = 0.0

# --- ELECTROSTATIQUE (Pour tester phi et éviter qu'il contamine Px) ---
[[boundary_rule]]
field     = "phi"
shape     = "edge"
edge_name = "left"
bc_type   = "DIRICHLET"
profile   = "constant"
val       = 0.0

[[boundary_rule]]
field     = "phi"
shape     = "edge"
edge_name = "right"
bc_type   = "DIRICHLET"
profile   = "constant"
val       = 100.0

# --- POLARISATION (Déjà présents, gardez-les) ---
[[boundary_rule]]
field     = "px"
shape     = "edge"
edge_name = "left"
bc_type   = "DIRICHLET"
profile   = "constant"
val       = 1.0

[[boundary_rule]]
field     = "px"
shape     = "edge"
edge_name = "right"
bc_type   = "DIRICHLET"
profile   = "constant"
val       = -1.0