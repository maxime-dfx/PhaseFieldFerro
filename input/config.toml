# ==============================================================================
# Fichier de Configuration TOML pour PhaseFieldFerro - MODE DEBUG / DIAGNOSTIC
# ==============================================================================
[output]
OutputDir = "../output"
MeshCreateFile = "maillage/maillage_gmsh"

[debug]
enabled = true    # <-- ACTIVE pour voir les logs de convergence (m, err_p, err_v)
                  #     et les messages "Non-convergence au temps ..."

[chrono]
chrono_mesh = true
chrono_Polarization = true
chrono_Mechanics = true
chrono_Electrostatics = true
chrono_Fracture = true
chrono_run = true

[physics]
enable_polarization = true
enable_mecanics = true
enable_electrostatics = true
enable_fracture = true

[simulation]
total_time = 1000.0
dt = 0.03
dt_relax = 0.1
save_frequency = 1            
tolerance_ferro = 1e-3
tolerance_vfield = 1e-3

[mesh]
calcul_mesh = false
get_mesh_file = "../input/rectangle.msh"
L_x = 200.0
L_y = 200.0
element_type = "TRIANGLE"

[polarization]
initial_polarization = "UNIFORM"
Px_0 = 1.0
Py_0 = 0.0

[mechanics]
initial_mechanics = "UNIFORM"
ux_0 = 0.0
uy_0 = 0.0

[electrostatics]
initial_electrostatics = "UNIFORM"
Ex_0 = 0.0
Ey_0 = 0.0

[fracture]
mode = "PERMEABLE"

# ==============================================================================
# PARAMÈTRES MATÉRIAU - identiques a la Table 1 du papier (Abdollahi & Arias, 2011)
# ==============================================================================
[material]
alpha_1    = -0.0023
alpha_11   = -0.0029
alpha_12   = -0.0011
alpha_111  = 0.003
alpha_112  = -0.00068
alpha_1111 = 0.001
alpha_1112 = 0.0093
alpha_1122 = 1.24
b1 = 1.4282
b2 = -0.185
b3 = 0.8066
c1 = 185.0
c2 = 111.0
c3 = 74.0
eps0 = 0.131
t    = 300.0
P0   = 1.0
c0   = 1.0
xi   = 1.0
a0    = 0.1
Gc    = 4.0
kappa = 2.0
mu_p  = 1.0
mu_v  = 15 
eta_k = 1e-6

# ==============================================================================
# CONDITIONS AUX LIMITES
# ==============================================================================

[[boundary_rule]]
field     = "phi"
shape     = "edge"
edge_name = "left"
bc_type   = "DIRICHLET"
profile   = "constant"
val       = 0.0

[[boundary_rule]]
field     = "phi"
shape     = "edge"
edge_name = "right"
bc_type   = "DIRICHLET"
profile   = "constant"
val       = 0.0

# ---- DÉPLACEMENT VERTICAL - BORD GAUCHE (pour initier la fissure) ----
# MOITIÉ SUPÉRIEURE : uy = +t
[[boundary_rule]]
field = "uy"
shape = "rect"
xmin = 0.0
xmax = 0.0
ymin = 100.0
ymax = 200.0
bc_type = "DIRICHLET"
profile = "time_ramp"
val_start = 0.0
val_end = 3.0
t_end = 3.0

# MOITIÉ INFÉRIEURE : uy = -t
[[boundary_rule]]
field = "uy"
shape = "rect"
xmin = 0.0
xmax = 0.0
ymin = 0.0
ymax = 100.0
bc_type = "DIRICHLET"
profile = "time_ramp"
val_start = 0.0
val_end = -3.0
t_end = 3.0

# ---- DÉPLACEMENT VERTICAL - FACE TOP ----
[[boundary_rule]]
field = "uy"
shape = "edge"
edge_name = "top"
bc_type = "DIRICHLET"
profile = "time_ramp"
val_start = 0.0
val_end = 3.0           # Comme dans l'article
t_end = 3.0

# ---- DÉPLACEMENT VERTICAL - FACE BOTTOM ----
[[boundary_rule]]
field = "uy"
shape = "edge"
edge_name = "bottom"
bc_type = "DIRICHLET"
profile = "time_ramp"
val_start = 0.0
val_end = -3.0          # SYMÉTRIQUE !
t_end = 3.0

# ---- DÉPLACEMENT HORIZONTAL - BLOCAGE EN UN POINT ----
[[boundary_rule]]
field = "ux"
shape = "point"
px = 0.0
py = 0.0
bc_type = "DIRICHLET"
profile = "constant"
val = 0.0